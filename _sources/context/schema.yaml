"$schema": https://json-schema.org/draft/2020-12/schema
title: RO-Crate JSON-LD Context
description: >-
  Unconstrained carrier schema: this block's content is its assembled JSON-LD context, not a data
  shape. It aggregates the RO-Crate vocabulary building blocks via `allOf`/`$ref` purely so the
  postprocessor's context-assembly mechanism (which is driven by schema `$ref` resolution) combines
  all of their JSON-LD contexts into one, plus this block's own RO-Crate-specific overrides and
  prefix declarations.
type: object
allOf:
  - "$ref": "bblocks://ogc.model.cross-domain.pcdm"
  - "$ref": "bblocks://ogc.model.cross-domain.prof"
  - "$ref": "bblocks://ogc.model.cross-domain.dcterms"
  - "$ref": "bblocks://ogc.model.cross-domain.iana-relations"
  - "$ref": "bblocks://ogc.researchobject.ro-crate.bioschemas.computational-workflow"
  - "$ref": "bblocks://ogc.researchobject.ro-crate.bioschemas.formal-parameter"
  - "$ref": "bblocks://ogc.model.cross-domain.geosparql"
  - "$ref": "bblocks://ogc.model.cross-domain.codemeta"
  - "$ref": "bblocks://ogc.ogc-utils.prov"
  - "$ref": "bblocks://ogc.model.cross-domain.pav"
  - "$ref": "bblocks://ogc.researchobject.ro-crate.vocab.ro-terms"
  # Schema.org last: the RO-Crate context uses Schema.org as its base vocabulary, so where a term
  # name collides with one of the more specific vocabularies above (e.g. `Person`/`Organization`/
  # `name`/`value` also defined by the imported PROV schema), Schema.org's binding must win. Context
  # assembly is last-`$ref`-wins on collision, so this block stays last in the list.
  - "$ref": "bblocks://ogc.model.cross-domain.schema-org"
