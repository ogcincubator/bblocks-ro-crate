"$schema": https://json-schema.org/draft/2020-12/schema
title: Bioschemas FormalParameter
description: >-
  An identified variable used to stand for the actual value(s) consumed or produced by a
  [ComputationalWorkflow](bblocks://ogc.researchobject.ro-crate.bioschemas.computational-workflow)
  step, per the Bioschemas [FormalParameter](https://bioschemas.org/profiles/FormalParameter/1.0-RELEASE)
  profile.
x-jsonld-context: context.jsonld
type: object
required:
  - name
properties:
  name:
    description: The name of the item.
    type: string
  identifier:
    description: >-
      Any kind of identifier for this item (e.g. an ISBN, GTIN, or UUID), given as a bare string,
      a URI, or a full `PropertyValue`.
    anyOf:
      - "$ref": "#/$defs/propertyValue"
      - type: array
        items:
          "$ref": "#/$defs/propertyValue"
      - type: string
      - type: array
        items:
          type: string
      - type: string
        format: uri
      - type: array
        items:
          type: string
          format: uri
  description:
    description: A description of the item.
    type: string
  additionalType:
    description: >-
      A more specific type for the item, typically from an external vocabulary — commonly a term
      from the [EDAM](http://edamontology.org/) `data` branch for a FormalParameter's data type.
    oneOf:
      - type: string
        format: uri
      - type: array
        items:
          type: string
          format: uri
  defaultValue:
    description: The default value for the FormalParameter. Commonly only used for inputs.
    oneOf:
      - "$ref": "#/$defs/thing"
      - type: string
  valueRequired:
    description: Whether the FormalParameter must be specified. Commonly only used for inputs.
    type: boolean
  encodingFormat:
    description: >-
      URL(s) of the accepted format(s). Strongly recommended: if absent, nothing should be assumed
      about the FormalParameter's encoding formats. Recommended vocabulary: the
      [EDAM](http://edamontology.org/) `format` branch, rooted at
      [`format_1915`](http://edamontology.org/format_1915).
    oneOf:
      - type: string
        format: uri
      - type: array
        items:
          type: string
          format: uri
"$defs":
  thing:
    description: The most generic type of item, per Schema.org's `Thing`.
    type: object
    required:
      - name
    properties:
      name:
        type: string
      identifier:
        type: string
      url:
        type: string
        format: uri
      additionalType:
        type: string
        format: uri
  propertyValue:
    description: A property-value pair, per Schema.org's `PropertyValue`.
    type: object
    properties:
      name:
        type: string
      identifier:
        type: string
      url:
        type: string
        format: uri
      additionalType:
        type: string
        format: uri
      propertyID:
        type: string
